name: CI

# Roda a cada push e a cada Pull Request na main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------- 1) Backend — Python (deps + erros reais + sintaxe) ----------
  backend:
    name: Backend · Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instala as dependencias
        run: pip install -r backend/requirements.txt
      - name: Lint (so erros de verdade, sem frescura de estilo)
        run: |
          pip install ruff
          ruff check --select E9,F backend/app
      - name: Checagem de sintaxe
        run: python -m compileall -q backend/app

  # ---------- 2) Frontend — Angular 22 (build de producao) ----------
  frontend:
    name: Frontend · Angular 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Configura o Node (22.12+, exigido pelo Angular 22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instala as dependencias
        run: npm ci
      - name: Build de producao
        run: npm run build

  # ---------- 3) Infra — valida os manifests do Kubernetes ----------
  k8s:
    name: Manifests · Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instala o kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Valida os YAML (os *.example sao ignorados pelo glob)
        run: kubeconform -strict -summary k8s/*.yaml

  # ---------- 4) Docker — builda as 2 imagens (so se o resto passar) ----------
  docker:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: [ backend, frontend, k8s ]
    steps:
      - uses: actions/checkout@v4
      - name: Configura o Buildx
        uses: docker/setup-buildx-action@v3
      - name: Builda a imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: catalogo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Builda a imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: catalogo-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max